name: Daily Brief Scan

on:
  schedule:
    # Two crons, one per UTC offset for Sydney DST. Both target 5am Sydney
    # so that GitHub Actions' typical 1-2h queue delay delivers the email
    # by 7am. has_scanned_today() in main.py ensures only the first one
    # that succeeds actually runs; the second is skipped automatically.
    - cron: '0 18 * * *'   # 5am AEDT (UTC+11, daylight saving Oct-Apr)
    - cron: '0 19 * * *'   # 5am AEST (UTC+10, standard time Apr-Oct)
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Run now regardless of current Sydney time'
        type: boolean
        default: true

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scanner/requirements.txt

      - name: Run scan
        working-directory: scanner
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DAILY_BRIEF_USER_ID: ${{ secrets.DAILY_BRIEF_USER_ID }}
          READWISE_TOKEN: ${{ secrets.READWISE_TOKEN }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SITE_URL: ${{ vars.SITE_URL }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}
        run: python main.py

